services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TZ: Europe/Nicosia
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
